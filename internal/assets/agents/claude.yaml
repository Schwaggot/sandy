name: claude
description: Claude Code CLI
image: "{{registry}}/sandy-claude-{{toolchain}}:latest"
command: ["claude"]
model:
  flag: "--model"
  format: "{{model}}"
env_passthrough:
  - ANTHROPIC_API_KEY
config_mounts:
  - host:
      linux: ~/.claude
      darwin: ~/.claude
      windows: ~/.claude
    container: /home/sandy/.claude
    mode: rw
  - host:
      linux: ~/.claude.json
      darwin: ~/.claude.json
      windows: ~/.claude.json
    container: /home/sandy/.claude.json
    mode: rw
    optional: true
