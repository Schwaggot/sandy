name: opencode
description: OpenCode coding agent
image: "{{registry}}/sandy-opencode-{{toolchain}}:latest"
command: ["opencode"]
model:
  flag: "--model"
  aliases: ["-m"]
  format: "{{provider}}/{{model}}"
  env:
    OPENCODE_CONFIG_CONTENT: '{"provider":{"{{provider}}":{"npm":"@ai-sdk/openai-compatible","name":"{{provider}}","options":{"baseURL":"{{url}}"},"models":{"{{model}}":{"name":"{{model}}","tool_call":true,"limit":{"context":{{context}},"output":16384}}}}}}'
env_passthrough:
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
config_mounts:
  - host:
      linux: ~/.config/opencode
      darwin: ~/.config/opencode
      windows: ~/.config/opencode
    container: /home/sandy/.config/opencode
    mode: rw
  - host:
      linux: ~/.opencode
      darwin: ~/.opencode
      windows: ~/.opencode
    container: /home/sandy/.opencode
    mode: rw
    optional: true
