name: images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # ghcr.io requires lowercase. Hardcoded because GitHub Actions has no
  # built-in lowercase function and github.repository_owner preserves case.
  OWNER: schwaggot

jobs:
  base:
    runs-on: ubuntu-latest
    outputs:
      base_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=${{ env.REGISTRY }}/${{ env.OWNER }}/sandy-base:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tag }}
      - name: trivy scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  toolchains:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [python, cpp, node, fullstack]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: images/toolchain-${{ matrix.toolchain }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.base.outputs.base_tag }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/sandy-toolchain-${{ matrix.toolchain }}:latest
      - name: trivy scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/sandy-toolchain-${{ matrix.toolchain }}:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  agents:
    needs: toolchains
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: [pi, opencode, claude]
        toolchain: [python, cpp, node, fullstack]
        exclude:
          # OpenCode and Claude Code need node; skip cpp/python-only variants
          # to avoid publishing broken images.
          - agent: opencode
            toolchain: python
          - agent: opencode
            toolchain: cpp
          - agent: claude
            toolchain: python
          - agent: claude
            toolchain: cpp
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: images/agent-${{ matrix.agent }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/sandy-toolchain-${{ matrix.toolchain }}:latest
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/sandy-${{ matrix.agent }}-${{ matrix.toolchain }}:latest
      - name: trivy scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/sandy-${{ matrix.agent }}-${{ matrix.toolchain }}:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
